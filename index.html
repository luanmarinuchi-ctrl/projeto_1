
<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css" />
    <title>Isso é fake news?</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Isso é fake news?</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra se é fake news passando o mouse</h2>

        <article class="cartao">
            <div class="cartao-interno">
                
                <!-- Lado da frente do cartão -->
                <div class="cartao-frente">
                    <img src="https://thumbs.dreamstime.com/b/um-menino-deitado-na-cama-lendo-livro-no-escuro-iluminando-com-uma-lanterna-do-telefone-195928602.jpg" alt="Um menino deitado na cama lendo livro no escuro iluminando com uma lanterna do telefone">
                    <p>Ler no escuro causa danos permanentes à visão?</p>
                </div>

                <!-- Lado do verso do cartão -->
                <div class="cartao-verso">
                    <img src="https://us.123rf.com/450wm/ocusfocus/ocusfocus1802/ocusfocus180200070/94799880-doce-linda-e-bonita-menina-loira-6-a-8-anos-de-idade-sob-a-cama-cobre-livro-de-leitura-no-escuro-%C3%A0.jpg?ver=6" alt="Menina loira de 6 a 8 anos de idade sob as cobertas da cama lendo livro no escuro">
                    <p><strong>Não!</strong> Ler com pouca luz pode causar fadiga ocular e desconforto temporário, mas não provoca danos permanentes aos olhos.</p>
                </div>

            </div>
        </article>
    </main>

    <footer></footer>
